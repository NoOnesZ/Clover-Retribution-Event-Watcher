plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'id.romulti.clover'
    compileSdk 35

    defaultConfig {
        applicationId 'id.romulti.clover'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.3.4'
        testInstrumentationRunner 'id.romulti.clover.DetectorSmokeRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
